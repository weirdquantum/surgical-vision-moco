# Improved training protocol shared by all project-1 configs.
data:
  root: data
  labelled_dir: Dataset
  split: official          # official | video_cv (whole videos held out)
  n_folds: 5
  split_seed: 0
  preload_size: [288, 512] # decode once, keep in RAM (h, w)
  num_workers: 2
seeds: [0, 1, 2, 3, 4]
model:
  backbone: convnext_tiny
  pretrained: true         # ImageNet-1k weights from torchvision
  dropout: 0.2
  drop_path: 0.1           # stochastic depth (ignored by ResNet / ConvNet)
augment:
  policy: modern
  image_size: [224, 384]   # (h, w), close to the 16:9 source frames
  crop_scale: [0.5, 1.0]
  hflip: 0.5
  rotation: 10
  color_jitter: [0.3, 0.3, 0.2, 0.03]
  color_jitter_p: 0.8
  random_erasing: 0.25
train:
  epochs: 60
  batch_size: 16
  drop_last: true          # avoid 2-image BatchNorm batches
  optimizer: adamw
  lr: 1.0e-3               # head learning rate
  backbone_lr_mult: 0.1    # backbone learning rate = 1e-4
  weight_decay: 0.05
  scheduler: cosine
  warmup_epochs: 3
  min_lr_ratio: 0.01
  label_smoothing: 0.1
  grad_clip: 1.0
  ema_decay: 0.99
  amp: true
  selection: {metric: loss, mode: min}   # smoother than accuracy on 33 images
eval:
  batch_size: 32
  tta_hflip: true
